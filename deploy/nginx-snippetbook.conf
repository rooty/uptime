# Замените uptime.example.com на production-домен.
# Если домен работает через Cloudflare Access, сохраните заголовок
# Cf-Access-Jwt-Assertion: приложение проверяет его подпись самостоятельно.

server {
    listen 80;
    listen [::]:80;
    server_name uptime.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uptime.example.com;

    # Сертификат должен быть выпущен для uptime.example.com.
    # Пути подходят для Cloudflare Origin CA и Let's Encrypt.
    ssl_certificate /etc/ssl/cloudflare/uptime.example.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/uptime.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 2m;

    # Страницы ошибок находятся на отдельном внешнем сайте.
    # Сохраняем исходный HTTP-код, чтобы 404/502 не превращались в 200.
    recursive_error_pages off;
    error_page 400 =400 /_external-errors/400.html;
    error_page 401 =401 /_external-errors/401.html;
    error_page 403 =403 /_external-errors/403.html;
    error_page 404 =404 /_external-errors/404.html;
    error_page 405 =405 /_external-errors/405.html;
    error_page 408 =408 /_external-errors/408.html;
    error_page 413 =413 /_external-errors/413.html;
    error_page 414 =414 /_external-errors/414.html;
    error_page 429 =429 /_external-errors/429.html;
    error_page 500 =500 /_external-errors/500.html;
    error_page 501 =501 /_external-errors/501.html;
    error_page 502 =502 /_external-errors/502.html;
    error_page 503 =503 /_external-errors/503.html;
    error_page 504 =504 /_external-errors/504.html;
    error_page 505 =505 /_external-errors/505.html;
    error_page 507 =507 /_external-errors/507.html;
    error_page 508 =508 /_external-errors/508.html;
    error_page 511 =511 /_external-errors/511.html;

    # Не допускаем прямого обращения к внутренним URI страниц ошибок.
    location ^~ /_external-errors/ {
        internal;
        proxy_ssl_server_name on;
        proxy_ssl_name error-pages.example.com;
        proxy_set_header Host error-pages.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
        proxy_pass https://error-pages.example.com/;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location / {
        proxy_intercept_errors on;
        proxy_pass http://127.0.0.1:8383;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
